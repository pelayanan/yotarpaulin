<section class="section" id="proses">
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow">Cara Pemesanan</span>
      <h2>Empat Langkah Sampai Terpal Tiba di Lokasi</h2>
      <p>Proses yang jelas dan transparan — dari konsultasi pertama hingga barang tiba di lokasi Anda.</p>
    </div>

    <ol class="steps">
      {% for item in site.data.steps %}
      <li class="step reveal">
        <span class="step__num">{{ forloop.index }}</span>
        <img class="step__icon" src="{{ site.baseurl }}/assets/images/{{ item.image }}" alt="" loading="lazy" width="72" height="72">
        <h3>{{ item.title }}</h3>
        <p>{{ item.text }}</p>
      </li>
      {% endfor %}
    </ol>

    <figure class="banner-wide reveal">
      <img src="{{ site.baseurl }}/assets/images/banner-custom.webp" alt="Butuh terpal dengan ukuran custom? Bisa custom ukuran, bahan berkualitas, pengerjaan cepat & rapi — hubungi kami sekarang 0812 2133 2929" loading="lazy" width="1200" height="669">
    </figure>
  </div>
</section>

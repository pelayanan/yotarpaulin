<div class="topbar">
  <div class="container topbar__inner">
    <span class="topbar__item">
      <svg class="ico" aria-hidden="true"><use href="#i-phone"/></svg>
      Hotline: <a href="tel:{{ site.phone_raw }}">{{ site.phone_display }}</a>
    </span>
    <span class="topbar__item topbar__item--right">
      <svg class="ico" aria-hidden="true"><use href="#i-clock"/></svg>
      Layanan &amp; Pengiriman 24/7
    </span>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-phone" viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm1-13h-2v6l5.2 3.1 1-1.7-4.2-2.5V7Z"/></symbol>
  <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.6-6.1c-.3-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4 0-.5.1-.7l.4-.5c.1-.2.2-.3.3-.5v-.5L9.7 7.6c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.9.9-1.1 2-.9 3.1.3 1.6 1.3 3.1 2.4 4.2 1.4 1.5 3.1 2.4 5 2.5.9.1 1.8-.2 2.5-.8.4-.4.7-1 .7-1.5v-.5l-1-.4Z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path fill="currentColor" d="M5 13h11.2l-4.6 4.6L13 19l7-7-7-7-1.4 1.4L16.2 11H5v2Z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2Z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1.2 13.6-2.6-2.6 1.4-1.4 1.2 1.2 4-4 1.4 1.4-5.4 5.4Z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="m12 17.3-6.2 3.7 1.6-7L2 9.2l7.2-.6L12 2l2.8 6.6 7.2.6-5.4 4.8 1.6 7L12 17.3Z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><path fill="currentColor" d="M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6l-10 6L2 6Z"/></symbol>
</svg>

<header class="site-header" id="top">
  <div class="container site-header__inner">
    <a class="brand" href="{{ site.baseurl }}/">
      <img src="{{ site.baseurl }}/assets/images/logo.webp" alt="Logo Yo Tarpaulin" width="56" height="42">
      <span class="brand__text">
        <strong>YO TARPAULIN</strong>
        <small>{{ site.brand_slogan }}</small>
      </span>
    </a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Buka menu">
    <label for="nav-toggle" class="nav-burger" aria-hidden="true"><span></span><span></span><span></span></label>

    <nav class="nav" aria-label="Navigasi utama">
      {% for item in site.data.navigation %}
        <a class="nav__link" href="{{ site.baseurl }}{{ item.link }}">{{ item.name }}</a>
      {% endfor %}
      <a class="btn btn--yellow btn--sm nav__cta" href="{{ site.whatsapp }}" target="_blank" rel="noopener">
        <svg class="ico" aria-hidden="true"><use href="#i-wa"/></svg> Hubungi Kami
      </a>
    </nav>
  </div>
</header>

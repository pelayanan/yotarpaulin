<section class="section section--alt" id="keunggulan">
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow">Keunggulan Kami</span>
      <h2>Kenapa Memilih YO TERPAL NUSANTARA RAYA?</h2>
      <p>Alasan utama tambang, kontraktor, dan distributor mempercayakan kebutuhan terpalnya kepada kami.</p>
    </div>

    <div class="cards cards--3">
      {% for item in site.data.advantages %}
      <article class="card reveal">
        <img class="card__icon" src="{{ site.baseurl }}/assets/images/{{ item.image }}" alt="" loading="lazy" width="84" height="84">
        <h3>{{ item.title }}</h3>
        <p>{{ item.text }}</p>
      </article>
      {% endfor %}
    </div>

    <figure class="banner-wide reveal">
      <img src="{{ site.baseurl }}/assets/images/banner-kenapa.webp" alt="Infografis keunggulan YO TERPAL NUSANTARA RAYA: penutup maksimal, tahan air, tahan panas & UV, bahan kuat, terpal & tarpaulin, layanan & pengiriman cepat" loading="lazy" width="1200" height="669">
    </figure>

    <div class="center">
      <a class="btn btn--blue" href="{{ site.baseurl }}/keunggulan/">Detail Keunggulan Kami <svg class="ico" aria-hidden="true"><use href="#i-arrow"/></svg></a>
    </div>
  </div>
</section>

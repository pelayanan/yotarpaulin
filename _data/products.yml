- image: prod-biru-premium.webp
  slug: terpal-biru-premium
  name: "Terpal Biru Premium"
  category: "Terpal PE Laminasi"
  desc: "Terpal PE lapis ganda warna biru, pilihan utama untuk penutup material di tambang dan proyek konstruksi."
  specs: ["120–200 GSM", "Tahan UV", "Anti Robek"]
  detail:
    - "Terpal PE dua lapis laminasi warna biru yang kami produksi langsung dengan pemeriksaan per batch: tenunan, lapisan laminasi, dan kekuatan tepi. Ketebalan 120–200 GSM memberi usia pakai panjang untuk pemakaian berat di lokasi tambang dan proyek."
    - "Warna biru netral tidak cepat terlihat kotor, dan permukaan laminasinya mengalirkan air hujan dengan lancar. Tersedia bentuk lembar, roll, serta ukuran custom sesuai kebutuhan proyek."

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  {% feed_meta %}
  {% seo %}

  {% if page.lang and page.lang_other %}
    {% if page.lang == "en" %}
      {% assign lang_id_href = page.lang_other %}{% assign lang_en_href = page.url %}
    {% else %}
      {% assign lang_id_href = page.url %}{% assign lang_en_href = page.lang_other %}
    {% endif %}
  <link rel="alternate" hreflang="id" href="{{ lang_id_href | absolute_url }}">
  <link rel="alternate" hreflang="en" href="{{ lang_en_href | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ lang_id_href | absolute_url }}">
  {% endif %}

  <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/images/favicon.png?v={{ site.time | date: '%Y%m%d%H%M' }}">
  <meta name="theme-color" content="#0a3168">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/styles.css?v={{ site.time | date: '%Y%m%d%H%M' }}">
</head>
